<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0C" />
    <title>Calendrier NEHOC</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; max-width: 100%; overflow-x: hidden; }
      body {
        min-height: 100dvh;
        padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
        background: #0b0b0c;
        color: #f4f1ea;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      main { width: min(100%, 400px); margin: 0 auto; }
      .kicker { margin: 0; color: #c9c4b8; font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; }
      h1 { margin: 6px 0 10px; font-size: 22px; }
      p { color: #9a9790; line-height: 1.45; }
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        margin: 10px 0 0;
        padding: 14px 12px;
        border-radius: 14px;
        border: 1px solid transparent;
        font-size: 16px;
        font-weight: 700;
        text-decoration: none;
        text-align: center;
      }
      .primary { background: #e8e4dc; color: #0b0b0c; }
      .ghost { background: transparent; color: #c9c4b8; }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker" id="client">NEHOC</p>
      <h1>Ajouter au calendrier</h1>
      <p>Touchez le bouton. Safari demandera d’autoriser, puis Calendrier proposera <strong>Ajouter</strong> pour la pose et les deux rappels.</p>
      <a class="btn primary" id="apple" href="#">Ajouter dans Calendrier</a>
      <a class="btn ghost" href="/">Retour à NEHOCPRO</a>
    </main>
    <script>
      function fromHash() {
        try {
          return JSON.parse(decodeURIComponent((location.hash || '#').slice(1) || '{}'));
        } catch {
          return {};
        }
      }
      var q = new URLSearchParams(location.search);
      var data = fromHash();
      if (!q.get('pose') && data.pose) {
        if (data.id) q.set('id', data.id);
        if (data.n) q.set('n', data.n);
        if (data.a) q.set('a', data.a);
        if (data.p) q.set('p', data.p);
        if (data.pose) q.set('pose', data.pose);
        if (data.r1) q.set('r1', data.r1);
        if (data.r2) q.set('r2', data.r2);
      }
      document.getElementById('client').textContent = q.get('n') || data.n || 'Client';
      document.getElementById('apple').href = '/nehoc-pose.ics?' + q.toString();
    </script>
  </body>
</html>
