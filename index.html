<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#161616"><title>NEHOCPRO</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head><body>
<header class="app-header"><button type="button" id="homeLogoBtn" class="brand-home" aria-label="Retour à l’accueil"><img src="logo-nehoc.jpeg" alt="Logo NEHOC" class="brand-logo"></button><div><h1>NEHOCPRO</h1><p>Relevés de chantier menuiserie</p></div></header>
<main class="container"><section id="homeView" class="view active"><div class="toolbar"><button class="primary" id="newSiteBtn">+ Nouveau chantier</button><button class="secondary" id="exportBtn">Sauvegarde complète</button><label class="secondary file-label">Importer<input id="importInput" type="file" accept="application/json" hidden></label></div><div id="siteList" class="card-list"></div></section>
<section id="editView" class="view"><div class="section-head"><button class="ghost" id="backBtn">← Retour</button><h2 id="editTitle">Nouveau chantier</h2></div><form id="siteForm">
<div class="card"><h3>Responsable du relevé</h3><label>Relevé effectué par *</label><select id="author" required><option value="">Sélectionner</option><option>Nathaniel</option><option>Michael</option><option>Emmanuel</option><option>Bruno</option></select></div>
<div class="card"><h3>Client et chantier</h3><div class="grid two"><div><label>Nom du client *</label><input id="clientName" required></div><div><label>Téléphone</label><input id="clientPhone" inputmode="tel"></div><div><label>E-mail</label><input id="clientEmail" type="email"></div><div><label>Adresse du chantier</label><input id="address"></div><div><label>Type de chantier</label><select id="siteType"><option>Maison</option><option>Appartement</option><option>Bureau</option><option>Immeuble</option><option>Commerce</option><option>Autre</option></select></div><div><label>Nature des travaux</label><select id="workType"><option>Rénovation</option><option>Construction neuve</option></select></div></div><label>Notes générales</label><textarea id="generalNotes" rows="4"></textarea></div>
<div class="card"><h3>Photos générales</h3><div class="photo-actions"><button type="button" class="primary cameraBtn" data-target="generalPhotos">📸 Prendre une photo</button><label class="secondary file-label">🖼 Choisir des photos<input class="photoPicker" data-target="generalPhotos" type="file" accept="image/*" multiple hidden></label></div><div id="generalPhotos" class="photo-grid"></div></div>
<div class="card"><div class="section-head"><h3>Pièces et menuiseries</h3><button type="button" class="secondary" id="addRoomBtn">+ Ajouter une pièce</button></div><div id="roomsContainer"></div></div>
<div class="sticky-actions">
  <button type="button" class="quick-add" id="quickAddRoomBtn">+ Ajouter une pièce</button>
  <button type="button" class="quick-add" id="quickAddOpeningBtn">+ Ajouter une menuiserie</button>
  <button type="submit" class="primary">Enregistrer le chantier</button>
  <button type="button" class="secondary" id="reportBtn">Générer / enregistrer le PDF</button>
</div></form></section>
<section id="reportView" class="view report-view">
  <div class="report-toolbar no-print">
    <button class="ghost" id="closeReportBtn">← Retour au chantier</button>
    <button class="primary" id="printReportBtn">Enregistrer en PDF / Imprimer</button>
  </div>
  <div id="reportDocument" class="report-document"></div>
</section></main>
<dialog id="cameraDialog"><div class="camera-panel"><div class="section-head"><h3>Prendre une photo</h3><button class="ghost" id="closeCameraBtn">Fermer</button></div><video id="cameraVideo" autoplay playsinline></video><canvas id="cameraCanvas" hidden></canvas><p id="cameraMessage" class="muted"></p><button class="primary full" id="captureBtn">Capturer la photo</button></div></dialog>
<template id="roomTemplate"><article class="room-card"><div class="section-head"><h4>Pièce</h4><button type="button" class="danger removeRoomBtn">Supprimer</button></div><label>Nom de la pièce</label><input class="roomName" placeholder="Ex. Séjour, Chambre 1..."><label>Notes sur la pièce</label><textarea class="roomNotes" rows="2"></textarea><div class="section-head"><h4>Menuiseries</h4></div><div class="openings"></div><button type="button" class="secondary addOpeningBtn add-opening-bottom">+ Ajouter une menuiserie</button></article></template>
<template id="openingTemplate"><article class="opening-card"><div class="section-head"><h5>Menuiserie</h5><button type="button" class="danger removeOpeningBtn">Supprimer</button></div><div class="grid two"><div><label>Type</label><select class="openingType"><option>Fenêtre</option><option>Porte-fenêtre</option><option>Coulissant</option><option>Baie vitrée</option><option>Porte d'entrée</option><option>Fixe</option><option>Autre</option></select></div><div><label>Repère</label><input class="openingRef" placeholder="Ex. F01"></div><div><label>Largeur (mm)</label><input class="width" type="number" min="0" inputmode="numeric"></div><div><label>Hauteur (mm)</label><input class="height" type="number" min="0" inputmode="numeric"></div><div><label>Type de pose</label><select class="poseType"><option>À définir</option><option>Rénovation sur dormant existant</option><option>Dépose totale</option><option>Pose en applique</option><option>Pose en tunnel</option><option>Pose en feuillure</option></select></div><div><label>Quantité</label><input class="quantity" type="number" min="1" value="1"></div><div><label>Couleur extérieure (RAL)</label><div class="color-picker-row"><span class="color-swatch color-swatch-form" title="Aperçu de la couleur"></span><select class="colorRal"><option value="">À définir</option><option>RAL 1013 - Blanc perlé</option><option>RAL 1015 - Ivoire clair</option><option>RAL 3004 - Rouge pourpre</option><option>RAL 5003 - Bleu saphir</option><option>RAL 5010 - Bleu gentiane</option><option>RAL 6005 - Vert mousse</option><option>RAL 6009 - Vert sapin</option><option>RAL 7012 - Gris basalte</option><option>RAL 7016 - Gris anthracite</option><option>RAL 7021 - Gris noir</option><option>RAL 7022 - Gris terre d’ombre</option><option>RAL 7035 - Gris clair</option><option>RAL 7039 - Gris quartz</option><option>RAL 7047 - Telegris 4</option><option>RAL 8014 - Brun sépia</option><option>RAL 8019 - Brun gris</option><option>RAL 9001 - Blanc crème</option><option>RAL 9005 - Noir profond</option><option>RAL 9006 - Aluminium blanc</option><option>RAL 9007 - Aluminium gris</option><option>RAL 9010 - Blanc pur</option><option>RAL 9016 - Blanc signalisation</option><option>RAL 9017 - Noir signalisation</option><option>Chêne doré</option><option>Noyer</option><option>Autre couleur / RAL</option></select></div></div></div><label>Notes</label><textarea class="openingNotes" rows="3"></textarea><div class="photo-actions"><button type="button" class="primary cameraBtn">📸 Prendre une photo</button><label class="secondary file-label">🖼 Choisir des photos<input class="photoPicker" type="file" accept="image/*" multiple hidden></label></div><div class="photo-grid openingPhotos"></div></article></template>
<script src="app.js"></script></body></html>
